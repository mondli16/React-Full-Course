<!DOCTYPE html>
<html>
  <head>
    <title>Exercises</title>
    <style>
      body{
        font-family: Arial;
      }
      .intro{
        font-size: 20px;
        margin-top: 20px;
        margin-bottom: 20px;
      }
      .email{
        padding: 12px 20px;
        margin-bottom: 10px;
      }
      .password {
        padding: 12px 20px;
        margin-bottom: 20px;
        margin-right: 10px;
      }
      .login{
        color: white;
        background-color: rgb(0, 123, 255);
        border: none;
        border-radius: 5px;
        padding: 12px 20px;
        margin-right: 10px;
      }

      .signUp{
        color: white;
        background-color: rgb(0, 123, 255);
        border: none;
        border-radius: 5px;
        padding: 12px 20px;
        margin-right: 10px;
      }

    </style>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">

    function Login(){
      const [showPassword, setShowPassword] = React.useState(false);

      function showPasswordHandler(){
        if(showPassword === false){
          setShowPassword(true);
        }
        else{
          setShowPassword(false);
        }
      }
      return(
        <>
        <div className="intro">
          Hello, welcome to my website
        </div>
        <div className="email-container">
          <input placeholder="Email" className="email"/>
        </div>
        <div className="password-container">
        <input placeholder="Password" className="password" type={showPassword === true?'text':'password'}/>
        <button className="passwordSwitch" onClick={showPasswordHandler}>{showPassword === false?'Show':'Hide'}</button>
        </div>
        </>
      )
    }
    function Buttons({buttonName}){
      return<button className={buttonName === 'Login'?'login':'signUp'}>
              {buttonName}</button>
    }

    function App(){
        return( 
        <>
            <Login/>
            <Buttons buttonName="Login"/>
            <Buttons buttonName="Sign Up"/>
        </>)
    }
    const container = document.querySelector('.js-container');
    ReactDOM.createRoot(container).render(<App/>);
    </script>
  </body>
</html>
