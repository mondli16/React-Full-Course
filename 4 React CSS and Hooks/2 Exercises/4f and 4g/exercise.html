<!DOCTYPE html>
<html>
  <head>
    <title>Exercises</title>
    <style>
      body{
        font-family: Arial;
      }
      .intro{
        font-size: 20px;
        margin-top: 20px;
        margin-bottom: 20px;
      }
      .email{
        padding: 12px 20px;
        margin-bottom: 10px;
      }
      .password {
        padding: 12px 20px;
        margin-bottom: 20px;
        margin-right: 10px;
      }
      .login{
        color: white;
        background-color: rgb(0, 123, 255);
        border: none;
        border-radius: 5px;
        padding: 12px 20px;
        margin-right: 10px;
      }

      .signUp{
        color: white;
        background-color: rgb(0, 123, 255);
        border: none;
        border-radius: 5px;
        padding: 12px 20px;
        margin-right: 10px;
      }

    </style>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
    function Counter(){
      const [time, setTime] = React.useState(dayjs().format('HH:mm:ss'));
      React.useEffect(()=>{
        setInterval(()=> setTime(dayjs().format('HH:mm:ss'), console.log('run code')), 1000);
        
        
      }, [])

    return(
    <>
      Current time: {time}
    </>)
    }

    function App(){
        return( 
        <>
            <Counter/>
        </>)
    }
    const container = document.querySelector('.js-container');
    ReactDOM.createRoot(container).render(<App/>);
    </script>
  </body>
</html>
