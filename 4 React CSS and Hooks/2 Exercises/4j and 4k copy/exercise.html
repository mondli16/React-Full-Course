<!DOCTYPE html>
<html>

<head>
  <title>Chatbot</title>
  <style>
    body{
      font-family: Arial;
      margin-top: 0%;
      margin-bottom: 0%;
    }
    .send-button{
      background-color: rgb(25, 135, 84);
      color: white;
      padding: 12px 20px;
      margin-left: 10px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      cursor: pointer;
    }

    .chat-input{
      padding: 12px 20px;
      border-radius: 10px;
      border-width: 1px;
      font-size: 15px;
      flex-grow: 1;
    }

    .chat-input-container {
      display: flex;
      margin-bottom: 60px;
    }

    .app-container{
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .user-container{
      display: flex;
      justify-content: end;
      align-items: start;
    }
    .robot-container{
      display: flex;
      align-items: start;
    }

    .message-container{
      background-color: rgb(238,238,238);
      padding: 15px 20px;
      border-radius: 10px;
      margin-right: 10px;
      margin-left: 10px;
      margin-bottom: 20px;
      max-width: 300px;
    }

    .robot-image{
        width:45px;
    }
    .user-image{
       width:45px;
    }

    .chat-message-container{
      margin-top: 20px;
      flex-grow: 1;
      overflow: scroll;
      scrollbar-width: none;
    }
    .first-paragraph{
      text-align: center;
    }

    .loadingMessage{
      height: 40px;
      margin: -15px;
    }
  </style>
</head>

<body>
  <div class="js-container"></div>

  <script src="https://unpkg.com/supersimpledev/react.js"></script>
  <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
  <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

  <script src="https://unpkg.com/supersimpledev/babel.js"></script>
  <script type="text/babel">

    function ChatInput({chatMessages, setChatmessages}) {
      const [inputText,setInputText] = React.useState('');
      const [isLoading, setIsLoading] = React.useState(false);
      function saveInputText (event){
          setInputText(event.target.value);
      }
      async function sendMessage(){

        // We can put this at the top of the function or
          // after the first setChatMessages(). Both work.
           if (isLoading || inputText === '') {
            return;
          }

          setIsLoading(true)

          const newChatMessages = [
          ...chatMessages,
          {
            message: inputText,
            sender:'user',
            id: crypto.randomUUID()
          }
        ];

          setChatmessages([
            ...newChatMessages,
            // This creates a temporary Loading... message.
            // Because we don't save this message in newChatMessages,
            // it will be remove later, when we add the response.
            {
              message: 'Loading...',
              sender: 'robot',
              id: crypto.randomUUID()
            }
          ]);

       

        const response = await Chatbot.getResponseAsync(inputText);
        setChatmessages([
          ...newChatMessages,
          {
            message: response,
            sender:'robot',
            id: crypto.randomUUID()
          }
        ]);
        
        setIsLoading(false);

      }
      function sendUsingKeys(event){
        
          if(event.key === 'Enter'){
            
            sendMessage()
          }
          else if(event.key === 'Escape')
          {
            setInputText('')
          }
      }
      return (
        <div className="chat-input-container">
          <input 
              placeholder="Send a message to Chatbot" 
              size="30" onChange={saveInputText} onKeyDown={sendUsingKeys}
              value ={inputText}
              className="chat-input"
            />
          <button onClick={sendMessage} className="send-button">Send</button>
        </div>
      );
    }

    function ChatMessage({message, sender}) {
      return (
        <div className={sender === 'robot'? 'robot-container': 'user-container'}>
          {sender === 'robot' && (
            <img src="assets/robot.jpeg" className="robot-image"/>
          )}
          <div className="message-container">{message!=='Loading...'? <p>{message}</p>:<img className="loadingMessage" src="assets/loading-spinner.gif"/>}</div>
          {sender === 'user' && 
          (<img src="assets/user.jpeg" className="user-image"/>)}

        </div>
      )
    }

    function ChatMessages ({chatMessages}) {
      const chatMessagesRef = React.useRef(null);
      React.useEffect(()=>{
        const contatainerElement = chatMessagesRef.current;
        if(contatainerElement){
          contatainerElement.scrollTop = contatainerElement.scrollHeight;
        }
      },[chatMessages]);
      return(
      <div className="chat-message-container" ref={chatMessagesRef}>
        {chatMessages.length === 0 && (<div className="first-paragraph">Welcome to the chatbot project! Send a messsage using the text below</div>)}
        {
          chatMessages.map((chatMessage)=> {
            return(
              <ChatMessage 
                message = {chatMessage.message} 
                sender={chatMessage.sender} 
                key ={chatMessage.id} 
              />
            )
          })}
      </div>
      )
    }

    function App (){
      const [chatMessages, setChatmessages] = React.useState([]);
      //const chatMessages = array[0];
      //const [chatMessages,setChatmessages] = array;
      //const setChatmessages = array[1];
      return(
      <div className="app-container">
        <ChatMessages chatMessages={chatMessages}/>
        <ChatInput
        chatMessages={chatMessages}
        setChatmessages = {setChatmessages}/>
      </div>)
    }
    const container = document.querySelector('.js-container');
    ReactDOM.createRoot(container).render(<App/>);
  </script>
</body>

</html>
